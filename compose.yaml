name: peritia

x-api-environment: &api-environment
  NODE_ENV: production
  APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
  APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
  JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
  DATABASE_URL: postgresql://peritia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/peritia
  REDIS_URL: redis://redis:6379
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_CACHE_MODE: postgres
  AI_PROVIDER: gemini
  GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_BILLING_TIER: ${GEMINI_BILLING_TIER:-free}
  GEMINI_INPUT_USD_PER_MILLION: ${GEMINI_INPUT_USD_PER_MILLION:-0.30}
  GEMINI_OUTPUT_USD_PER_MILLION: ${GEMINI_OUTPUT_USD_PER_MILLION:-2.50}
  AI_MODEL_REVISION: ${AI_MODEL_REVISION:?Set an explicit cache revision}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-explanation-v3}
  AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-16384}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
  BILLING_ENABLED: ${BILLING_ENABLED:-false}
  LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
  LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
  LEMONSQUEEZY_PRO_VARIANT_ID: ${LEMONSQUEEZY_PRO_VARIANT_ID:-}
  LEMONSQUEEZY_TOPUP_VARIANT_ID: ${LEMONSQUEEZY_TOPUP_VARIANT_ID:-}
  LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
  LEMONSQUEEZY_TEST_MODE: ${LEMONSQUEEZY_TEST_MODE:-true}
  PAID_MONTHLY_ALLOWANCE: ${PAID_MONTHLY_ALLOWANCE:-100}
  TOPUP_ALLOWANCE: ${TOPUP_ALLOWANCE:-50}

services:
  migrate:
    build: .
    command: ["node", "--env-file-if-exists=.env", "scripts/migrate-postgres.mjs"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: .
    command: ["node", "dist/server/api.mjs"]
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/server/worker.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
      DATABASE_URL: postgresql://peritia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/peritia
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_BILLING_TIER: ${GEMINI_BILLING_TIER:-free}
      GEMINI_INPUT_USD_PER_MILLION: ${GEMINI_INPUT_USD_PER_MILLION:-0.30}
      GEMINI_OUTPUT_USD_PER_MILLION: ${GEMINI_OUTPUT_USD_PER_MILLION:-2.50}
      AI_MODEL_REVISION: ${AI_MODEL_REVISION:?Set an explicit cache revision}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-explanation-v3}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-16384}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: peritia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: peritia
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peritia -d peritia"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  postgres:
  redis:
  certificates:
  caddy_config:
