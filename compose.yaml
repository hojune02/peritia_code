name: peritia

x-api-environment: &api-environment
  NODE_ENV: production
  APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
  APP_URL: https://${DOMAIN:?Set DOMAIN in .env}
  JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
  DATABASE_URL: postgresql://peritia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/peritia
  REDIS_URL: redis://redis:6379
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_CACHE_MODE: postgres
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
  OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:?Set the immutable model digest}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-explanation-v1}
  AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
  LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
  LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
  LEMONSQUEEZY_VARIANT_ID: ${LEMONSQUEEZY_VARIANT_ID:-}
  LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
  LEMONSQUEEZY_TEST_MODE: ${LEMONSQUEEZY_TEST_MODE:-true}

services:
  migrate:
    build: .
    command: ["node", "--env-file-if-exists=.env", "scripts/migrate-postgres.mjs"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: .
    command: ["node", "dist/server/api.mjs"]
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "dist/server/worker.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      JWT_SECRET: ${JWT_SECRET:?Run npm run setup first}
      DATABASE_URL: postgresql://peritia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/peritia
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST:?Set the immutable model digest}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-explanation-v1}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-600}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      ollama: { condition: service_started }
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: peritia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: peritia
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peritia -d peritia"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [models:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  postgres:
  redis:
  models:
  certificates:
  caddy_config:
