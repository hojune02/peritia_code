<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem("peritia:theme"); } catch {}
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta
      name="description"
      content="Turn a public GitHub repository into an interactive, beginner-friendly guide to its structure, source code, and technology stack."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Peritia — Understand the repository</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
